# Override with -Dserver.port=8081 or PORT=8081 if 8080 is taken
server.port=${PORT:8080}

# File-backed so registered accounts and bookings survive restarts.
# Delete ./data/ to reset to a clean seeded database.
spring.datasource.url=jdbc:h2:file:./data/eventzone;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.defer-datasource-initialization=true
# Required: Boot only auto-runs data.sql for ":mem:" URLs, so a file-backed H2
# would skip seeding entirely. data.sql is guarded to be safe to re-run.
spring.sql.init.mode=always
logging.level.org.springframework=INFO
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-string-of-32-plus-characters}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

